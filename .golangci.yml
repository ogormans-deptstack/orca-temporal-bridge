run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - misspell
    - unused
    - ineffassign
    - gocritic
  
  exclude-rules:
    - linters: [misspell]
      path: _test\.go
    - linters: [gocritic]
      text: "commentedOutCode"
  
  settings:
    gocritic:
      enabled-checks:
        - dupImport
        - nestingReduce
        - truncateCmp
        - unnamedResult

formatters:
  enable:
    - gofmt
    - goimports

output:
  format: colored-line-number
  sort-order:
    - file
  sort-results: true

issues:
  exclude-dirs:
    - vendor
  max-issues-per-linter: 0
  max-same-issues: 0
