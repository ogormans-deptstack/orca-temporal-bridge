linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - misspell
    - unused
    - ineffassign
    - gocritic

linters-settings:
  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - opinionated
      - performance
    disabled-checks:
      - commentedOutCode

issues:
  exclude-dirs:
    - vendor
