services:
  # Temporal Server - Development mode
  # Uses SQLite for local storage, runs all services in-process
  # For CI/CD: Run `temporal server start-dev` instead (no Docker needed)
  #
  # Local usage:
  #   docker-compose up
  #   Connect to: localhost:7233 (gRPC), localhost:8233/ui (Web UI)
  #
  # Recommended for local development:
  #   temporal server start-dev
  #   (faster startup, no Docker overhead)

  temporal:
    image: temporalapi/temporal-server:latest
    container_name: temporal
    ports:
      - "7233:7233"    # gRPC
      - "7234:7234"    # HTTP
      - "6933:6933"    # gRPC TLS
      - "8233:8233"    # Web UI
    environment:
      - TEMPORAL_LOG_LEVEL=info
      - DB=sqlite
      - SQLITE_FILENAME=/var/lib/temporal/temporal.db
    volumes:
      - temporal-data:/var/lib/temporal
    healthcheck:
      test: ["CMD", "temporal", "workflow", "list"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 10s

  temporal-ui:
    image: temporalapi/temporal-ui:latest
    container_name: temporal-ui
    ports:
      - "8080:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    depends_on:
      temporal:
        condition: service_healthy

volumes:
  temporal-data:
    driver: local
